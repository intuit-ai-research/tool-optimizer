[project]
name = "agent-tool-interface-optimizer"
version = "1.0.0"
requires-python = ">=3.12.0"
description = "Describe your Python package here"
readme = "README.md"

dependencies=[
    "torch>=2.9.1",
    "PyYAML>=6.0.3",
    "transformers==4.57.6",
    "accelerate==1.12.0",
    "datasets==4.5.0",
    "huggingface-hub>=0.34.0,<1.0",
    "smolagents[toolkit,openai,telemetry]>=1.23.0",
    "openai>=1.0.0",
    "tqdm>=4.67.1",
    "termcolor>=3.2.0",
    "fastapi>=0.121.0",
    "shortuuid>=1.0.13",
    "uvicorn>=0.38.0",
    "flask>=3.1.2",
    "slowapi>=0.1.9",
    "rank-bm25>=0.2.2",
    "tenacity>=9.1.2",
    "joblib>=1.5.2",
    "scikit-learn>=1.7.2",
    "mcp>=1.20.0",
    "python-dotenv>=1.0.0",
    "arize-phoenix>=12.0.0",
    "openinference-instrumentation-smolagents>=0.1.20",
    "jsonschema>=4.0.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
vllm = [
    "vllm>=0.15.1; sys_platform == 'linux'",
    "smolagents[vllm]>=1.23.0; sys_platform == 'linux'",
]

[tool.uv]
default-groups = ["dev"]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[dependency-groups]
dev = [
    "black~=25.1.0",
    "isort~=6.0.1",
    "mypy>=1.15.0",
    "pytest-asyncio~=1.3.0",
    "pytest>=8.3.5",
    "pytest-mock>=3.15.1",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.6.1",
    "pytest-asyncio~=1.3.0"
]

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]
pythonpath = [
  "src"
]

testpaths = [
     "tests"
]

markers = ["integration: mark a test as a integration test.",
          "unit: mark a test as a unit test.",]



[tool.black]
line-length = 122
target-version = ["py312"]
extend-exclude = '''
/(
    \.claude/skills
    | __pycache__
)/
'''

[tool.ruff.lint.per-file-ignores]
"src/*" = ["E402"]

[tool.isort]
profile = "black"

[tool.mypy]
# Start off with these
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

# Getting these passing should be easy
strict_equality = true
extra_checks = true

# Strongly recommend enabling this one as soon as you can
check_untyped_defs = true

plugins = ["pydantic.mypy"]

# Module resolution: src/ is treated as the package root
mypy_path = "src"

[[tool.mypy.overrides]]
module = "pynumaflow.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [

]
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/tool_annotator",
    "src/agent_tool_optimizer",
    "src/tool_desc_improve_tracefree",
    "src/tool_exec_tracer",
    "src/utils",
]