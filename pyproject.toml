[project]
name = "intuit.agent-tool-interface-optimizer"
version = "1.0.0"
requires-python = ">=3.12.0"
description = "Describe your Python package here"
readme = "README.md"


dependencies=[
    "transformers==4.57.6"
]

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
    "black~=25.1.0",
    "isort~=6.0.1",
    "mypy>=1.15.0",
    "pytest-asyncio~=1.3.0",
    "pytest>=8.3.5",
    "pytest-mock>=3.15.1",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.6.1",
    "pytest-asyncio~=1.3.0"
]

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]
pythonpath = [
  "src"
]

testpaths = [
     "tests"
]

markers = ["integration: mark a test as a integration test.",
          "unit: mark a test as a unit test.",]



[tool.black]
line-length = 122
target-version = ["py312"]
extend-exclude = '''
/(
    \.claude/skills
    | __pycache__
)/
'''

[tool.ruff.lint.per-file-ignores]
"src/*" = ["E402"]

[tool.isort]
profile = "black"

[tool.mypy]
# Start off with these
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

# Getting these passing should be easy
strict_equality = true
extra_checks = true

# Strongly recommend enabling this one as soon as you can
check_untyped_defs = true

plugins = ["pydantic.mypy"]

# Module resolution: src/ is treated as the package root
mypy_path = "src"

[[tool.mypy.overrides]]
module = "pynumaflow.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [

]
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/*"]